<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English for Debate — HUFLIT Course System</title>
<style>
:root{
  --roof:#8a3b2e;
  --roof-dark:#6b2c22;
  --pillar:#c98a3e;
  --foundation:#2f4a3e;
  --paper:#faf6ee;
  --paper2:#f1ead9;
  --ink:#26201a;
  --ink-soft:#5a5044;
  --line:#ddd1b8;
  --accent:#1f6f5c;
  --wrong:#a4433a;
  --right:#2f6b46;
  --serif: 'Iowan Old Style','Palatino Linotype', Georgia, 'Times New Roman', serif;
  --sans: 'Avenir Next','Segoe UI', Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:
    radial-gradient(circle at 15% 0%, #fffaf0 0%, transparent 45%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
}

/* ---------- Header / house motif ---------- */
header.top{
  position:relative;
  background: linear-gradient(180deg,var(--roof) 0%, var(--roof-dark) 100%);
  color:#fdf3e6;
  padding:28px 20px 60px;
  overflow:hidden;
}
header.top::after{
  content:"";
  position:absolute; left:0; right:0; bottom:0; height:26px;
  background:var(--paper);
  clip-path: polygon(0 100%, 3% 40%, 6% 100%, 9% 45%, 12% 100%, 15% 40%, 18% 100%, 21% 45%, 24% 100%, 27% 40%, 30% 100%, 33% 45%, 36% 100%, 39% 40%, 42% 100%, 45% 45%, 48% 100%, 51% 40%, 54% 100%, 57% 45%, 60% 100%, 63% 40%, 66% 100%, 69% 45%, 72% 100%, 75% 40%, 78% 100%, 81% 45%, 84% 100%, 87% 40%, 90% 100%, 93% 45%, 96% 100%, 99% 40%, 100% 100%, 100% 100%, 0 100%);
}
.top-inner{max-width:1000px;margin:0 auto;position:relative;z-index:2;}
.eyebrow{
  font-family:var(--sans); text-transform:uppercase; letter-spacing:.16em;
  font-size:.72rem; color:#f0c894; margin-bottom:10px; font-weight:600;
}
h1.course-title{
  font-family:var(--serif); font-weight:400; font-size:2.5rem; line-height:1.08;
  margin:0 0 6px; letter-spacing:.01em;
}
.course-sub{font-family:var(--sans); font-size:.95rem; color:#f4e4cb; opacity:.9;}

/* the "house" diagram in header */
.house-badge{
  position:absolute; right:26px; top:18px; width:96px; height:96px; opacity:.9;
}

/* ---------- Layout ---------- */
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 80px;}
.layout{display:grid; grid-template-columns:220px 1fr; gap:28px; margin-top:26px;}
@media (max-width:820px){ .layout{grid-template-columns:1fr;} }

/* ---------- Session nav ---------- */
nav.sessions{
  position:sticky; top:16px; align-self:start;
  max-height:calc(100vh - 32px); overflow-y:auto;
  background:var(--paper2); border:1px solid var(--line); border-radius:10px; padding:10px;
}
nav.sessions .nav-title{font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); padding:6px 8px 10px; font-weight:700;}
.nav-item{
  display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
  font-family:var(--sans); font-size:.86rem; color:var(--ink); padding:8px 9px; border-radius:6px;
  margin-bottom:2px; line-height:1.25;
}
.nav-item .n{ font-family:var(--serif); font-style:italic; color:var(--pillar); margin-right:5px;}
.nav-item:hover{background:#e8dec2;}
.nav-item.active{background:var(--roof); color:#fdf3e6;}
.nav-item.active .n{color:#f0c894;}
.nav-item .tag{display:block; font-size:.68rem; color:var(--ink-soft); font-style:italic;}
.nav-item.active .tag{color:#f4e0c4;}

/* ---------- Main content card ---------- */
main.session{background:#fffdf8; border:1px solid var(--line); border-radius:12px; padding:34px 38px; box-shadow:0 1px 0 rgba(0,0,0,.03);}
@media(max-width:600px){ main.session{padding:22px 18px;} }

.session-kicker{font-size:.72rem; text-transform:uppercase; letter-spacing:.13em; color:var(--accent); font-weight:700; margin-bottom:8px;}
h2.session-title{font-family:var(--serif); font-size:1.9rem; font-weight:400; margin:0 0 14px; color:var(--roof-dark);}
.refs{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px;}
.ref-chip{font-size:.78rem; background:var(--paper2); border:1px solid var(--line); border-radius:20px; padding:5px 13px; color:var(--ink-soft);}
.badge-selfstudy, .badge-minitest, .badge-review{
  display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.04em;
  padding:4px 11px; border-radius:20px; margin-bottom:16px; margin-right:8px;
}
.badge-selfstudy{background:#eadcc4; color:#6b4c1f;}
.badge-minitest{background:#f0d8d3; color:var(--wrong);}
.badge-review{background:#d9e6df; color:var(--right);}

/* objectives */
.objectives{background:var(--paper2); border-left:4px solid var(--pillar); border-radius:0 8px 8px 0; padding:16px 20px; margin:20px 0 28px;}
.objectives h3{margin:0 0 8px; font-size:.85rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);}
.objectives ul{margin:0; padding-left:20px;}
.objectives li{margin-bottom:5px; font-size:.94rem;}

/* section tabs */
.tabbar{display:flex; gap:6px; border-bottom:2px solid var(--line); margin:30px 0 24px; flex-wrap:wrap;}
.tabbtn{
  font-family:var(--sans); font-weight:600; font-size:.86rem; background:none; border:none; cursor:pointer;
  padding:10px 16px; color:var(--ink-soft); border-bottom:3px solid transparent; margin-bottom:-2px;
}
.tabbtn.active{color:var(--roof-dark); border-bottom-color:var(--roof);}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

/* lecture */
.lec-block{margin-bottom:26px;}
.lec-block h4{font-family:var(--serif); font-size:1.2rem; color:var(--foundation); margin:0 0 10px; font-weight:600;}
.lec-block p{line-height:1.65; margin:0 0 12px; font-size:.98rem;}
.lec-block ul, .lec-block ol{line-height:1.65; font-size:.98rem;}
table.mini-table{width:100%; border-collapse:collapse; margin:14px 0 18px; font-size:.9rem;}
table.mini-table th, table.mini-table td{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top;}
table.mini-table th{background:var(--paper2); font-family:var(--sans); font-weight:700; color:var(--foundation);}

/* practice */
.practice-card{background:var(--paper2); border-radius:10px; padding:18px 22px; margin-bottom:18px; border:1px solid var(--line);}
.practice-card h4{margin:0 0 10px; font-family:var(--serif); font-size:1.1rem; color:var(--roof-dark);}
.practice-card p, .practice-card ol, .practice-card ul{font-size:.94rem; line-height:1.6;}
.key{color:var(--accent); font-weight:600; background:#e4f1ec; border-radius:6px; padding:8px 12px; display:inline-block; margin-top:6px;}

/* quiz */
.quiz-progress{font-size:.82rem; color:var(--ink-soft); margin-bottom:14px;}
.qcard{border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; background:#fffefb;}
.qcard .qtext{font-weight:700; margin-bottom:12px; font-size:.98rem;}
.opt{
  display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px;
  border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-family:var(--sans); font-size:.92rem;
}
.opt:hover{background:var(--paper2);}
.opt.selected{border-color:var(--pillar); background:#fbeed6;}
.opt.correct{border-color:var(--right); background:#dff0e5; font-weight:700;}
.opt.incorrect{border-color:var(--wrong); background:#f6e0dd;}
.opt[disabled]{cursor:default;}
.explain{font-size:.87rem; margin-top:10px; padding:10px 12px; border-radius:8px; background:var(--paper2); display:none;}
.explain.show{display:block;}
.quiz-actions{display:flex; gap:12px; align-items:center; margin-top:18px;}
button.primary{
  background:var(--roof); color:#fdf3e6; border:none; padding:11px 22px; border-radius:8px;
  font-weight:700; cursor:pointer; font-family:var(--sans); font-size:.9rem;
}
button.primary:hover{background:var(--roof-dark);}
button.ghost{
  background:none; border:1px solid var(--line); padding:10px 18px; border-radius:8px;
  cursor:pointer; font-family:var(--sans); font-size:.9rem; color:var(--ink-soft);
}
.score-box{font-weight:700; color:var(--accent); font-size:1rem;}

/* videos */
.video-card{border:1px solid var(--line); border-radius:10px; padding:18px 22px; margin-bottom:18px; background:#fffefb;}
.video-card .vchannel{font-size:.76rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:700; margin-bottom:4px;}
.video-card h4{margin:0 0 8px; font-family:var(--serif); font-size:1.15rem; color:var(--roof-dark);}
.video-card a.vlink{font-size:.86rem; word-break:break-all; color:var(--accent); text-decoration:none; font-weight:600;}
.video-card a.vlink:hover{text-decoration:underline;}
.video-card .vlabel{font-weight:700; font-size:.8rem; color:var(--ink-soft); display:block; margin-top:12px; margin-bottom:3px; text-transform:uppercase; letter-spacing:.05em;}
.video-card p{font-size:.92rem; line-height:1.6; margin:0;}
.video-card.gap{border-style:dashed; opacity:.9;}

/* footer nav buttons */
.session-footer-nav{display:flex; justify-content:space-between; margin-top:38px; padding-top:22px; border-top:1px solid var(--line);}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}

/* ---------- Mobile session drawer fix ---------- */
.mobile-session-toggle{display:none;}
.session-backdrop{display:none;}
@media(max-width:820px){
  .layout{display:block; margin-top:16px;}
  nav.sessions{
    position:fixed; z-index:1001; left:0; top:0; bottom:0; width:min(86vw,340px);
    max-height:none; overflow-y:auto; margin:0; border-radius:0 12px 12px 0;
    padding:18px 12px 28px; transform:translateX(-105%); transition:transform .22s ease;
    box-shadow:10px 0 30px rgba(0,0,0,.18);
    -webkit-overflow-scrolling:touch;
  }
  nav.sessions.open{transform:translateX(0);}
  .session-backdrop{
    position:fixed; z-index:1000; inset:0; background:rgba(0,0,0,.42);
  }
  .session-backdrop.open{display:block;}
  .mobile-session-toggle{
    display:inline-flex; position:fixed; z-index:999; right:14px; bottom:16px;
    align-items:center; justify-content:center; gap:7px;
    background:var(--roof); color:#fdf3e6; border:0; border-radius:999px;
    padding:11px 16px; font-family:var(--sans); font-weight:700; font-size:.86rem;
    box-shadow:0 5px 18px rgba(0,0,0,.2); cursor:pointer;
  }
  body.drawer-open{overflow:hidden;position:fixed;width:100%;left:0;right:0;}
  main.session{width:100%;}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="eyebrow">HUFLIT · English Language Major · 3 Credits</div>
    <h1 class="course-title" id="courseTitle">English for Debate</h1>
    <div class="course-sub" id="courseSub">A 15-session digital lecture &amp; practice system</div>
  </div>
  <svg class="house-badge" viewBox="0 0 100 100" fill="none">
    <polygon points="50,8 92,42 84,42 84,90 16,90 16,42 8,42" fill="#f0c894" opacity=".85"/>
    <rect x="30" y="55" width="14" height="35" fill="#6b2c22"/>
    <rect x="56" y="55" width="14" height="18" fill="#6b2c22"/>
    <text x="50" y="30" font-size="9" text-anchor="middle" fill="#6b2c22" font-family="Georgia, serif">OPINION</text>
  </svg>
</header>

<div class="wrap">
  <div class="layout">
    <button class="mobile-session-toggle" id="sessionToggle" type="button" aria-controls="sessionNav" aria-expanded="false">☰ Sessions</button>
    <div class="session-backdrop" id="sessionBackdrop"></div>
    <nav class="sessions" id="sessionNav"></nav>
    <main class="session" id="sessionMain"></main>
  </div>
</div>

<script>
// ============================================================
// English for Debate — HUFLIT — 15-Session Course Data
// ============================================================
const COURSE = {
  title: "English for Debate",
  subtitle: "HUFLIT — English Language Major | 3 Credits | 15 Sessions",
  sessions: []
};

function addSession(s){ COURSE.sessions.push(s); }

// ---------------- SESSION 1 ----------------
addSession({
  week: 1,
  title: "Introduction to Debate & Basic Opinions",
  skillRef: "Discover Debate – Unit 1: Have an Opinion",
  topicRef: "Exploring Debate 2 – Unit 1: School Uniforms",
  objectives: [
    "Explain what academic debate is and identify the Affirmative and Negative teams, the Resolution, the Judge, and the Audience.",
    "Classify a statement as an Opinion of Value, an Opinion of Policy, or an Opinion of Fact.",
    "Recognize agreement and disagreement between speakers in a short conversation.",
    "Build topic vocabulary and arguments around the theme of School Uniforms."
  ],
  lecture: [
    {
      h: "1. What Is Debate?",
      body: `<p>A <b>debate</b> is a formal contest of argumentation in which two sides speak for and against a stated proposition. Every debate starts from a <b>Resolution</b> (also called a <b>Proposition</b>) — the single sentence that the whole round argues about, e.g. <i>"This house believes that school uniforms should be compulsory."</i></p>
      <p>The team that supports the resolution is the <b>Affirmative Team</b> (Aff); the team that opposes it is the <b>Negative Team</b> (Neg). A <b>Judge</b> (or a panel of judges) listens to both sides and decides which team argued more convincingly. In a classroom, the rest of the class is the <b>Audience</b>.</p>
      <p>Think of a debate case as a <b>house</b>: the <b>opinion</b> (resolution) is the roof; the <b>reasons</b> are the pillars holding the roof up; the <b>evidence</b> is the foundation that keeps the pillars standing. If any part is missing or weak, the house — and the argument — collapses.</p>`
    },
    {
      h: "2. Three Types of Opinion",
      body: `<p>Almost every resolution falls into one of three categories. Learning to identify these categories quickly is the first debate skill, because each type is proven with different kinds of reasons and evidence.</p>
      <table class="mini-table">
        <tr><th>Type</th><th>Pattern</th><th>Example</th></tr>
        <tr><td><b>Value</b></td><td>X is better / worse than Y</td><td>"Public schools are better than private schools."</td></tr>
        <tr><td><b>Policy</b></td><td>X should / should not do Y</td><td>"Schools should require uniforms."</td></tr>
        <tr><td><b>Fact</b></td><td>X is / was / will be true</td><td>"Uniforms reduce bullying in schools."</td></tr>
      </table>
      <p>Policy resolutions are the most common in classroom debate because they ask for concrete action and naturally invite a for/against structure.</p>`
    },
    {
      h: "3. Agreeing and Disagreeing",
      body: `<p>Before we can argue, we need the everyday language of agreement and disagreement:</p>
      <ul>
        <li><b>Agreeing:</b> "I agree." / "That's exactly how I see it." / "You've got a point there."</li>
        <li><b>Disagreeing politely:</b> "I see it differently." / "I'm not so sure about that." / "I'd have to disagree, because..."</li>
      </ul>
      <p>In debate, disagreement is never personal — it targets the <i>argument</i>, not the person making it.</p>`
    },
    {
      h: "4. Topic Focus — School Uniforms",
      body: `<p>Should students be required to wear school uniforms? Supporters argue that uniforms save families money, reduce peer pressure and competition over clothing, and create a stronger sense of school spirit and equality. Critics argue that uniforms suppress students' individuality and self-expression, do little to actually change behavior, and add an unnecessary cost for low-income families who must still buy regular clothes for outside of school.</p>
      <p><b>Useful vocabulary:</b> uniform, conform / conformity, eliminate, individuality, peer pressure, self-expression, suppress, distraction, school spirit, socioeconomic status.</p>`
    }
  ],
  practice: [
    {
      title: "Exercise A — Classify the Opinion",
      body: `<p>Label each sentence <b>V</b> (Value), <b>P</b> (Policy), or <b>F</b> (Fact).</p>
      <ol type="a">
        <li>Uniforms are less expensive than regular clothes over a school year.</li>
        <li>All public schools should adopt a compulsory uniform policy.</li>
        <li>A relaxed dress code is better for student creativity than a uniform.</li>
        <li>Students who wear uniforms report fewer instances of being teased about clothing.</li>
        <li>Parents, not schools, should decide what children wear.</li>
      </ol>
      <p class="key">Answer key: a) F  b) P  c) V  d) F  e) P</p>`
    },
    {
      title: "Exercise B — Agree or Disagree",
      body: `<p>Work with a partner. Partner A reads an opinion about school uniforms; Partner B responds, clearly signaling agreement or disagreement and giving one short reason. Example:<br>
      <i>A: "I think uniforms make school less stressful because nobody worries about what to wear."<br>
      B: "I see it differently — uniforms don't remove stress, they just hide it. Students still compare shoes, bags, and watches."</i></p>`
    }
  ],
  quiz: [
    {q:"What is the single sentence that an entire debate argues about called?", options:["The Judge","The Resolution","The Rebuttal","The Audience"], a:1, exp:"The Resolution (or Proposition) is the statement both teams debate."},
    {q:"Which team supports the resolution?", options:["The Negative Team","The Judge","The Affirmative Team","The Audience"], a:2, exp:"The Affirmative Team argues in favor of the resolution."},
    {q:"\"The government should ban plastic bags\" is an opinion of...", options:["Value","Policy","Fact","Opinion is not classifiable"], a:1, exp:"It uses the pattern 'X should do Y', which is Policy."},
    {q:"\"Cats make better pets than dogs\" is an opinion of...", options:["Value","Policy","Fact","None of the above"], a:0, exp:"It compares two things using 'better than', which is Value."},
    {q:"\"The Earth's temperature is rising\" is an opinion of...", options:["Value","Policy","Fact","Policy and Fact"], a:2, exp:"It states something claimed to be true, which is Fact."},
    {q:"In the 'debate house' metaphor, what does the roof represent?", options:["Evidence","Reasons","The Opinion / Resolution","The Judge"], a:2, exp:"The roof is the opinion; pillars are reasons; the foundation is evidence."},
    {q:"According to the lesson, one argument FOR school uniforms is that they...", options:["increase clothing costs","reduce competition over clothing among students","eliminate all school stress","are required by international law"], a:1, exp:"Supporters argue uniforms reduce peer pressure/competition over clothes."}
  ],
  videos: [
    {
      channel: "PBS Student Reporting Labs / local U.S. news",
      title: "Do School Uniforms Help Students Learn?",
      url: "https://www.youtube.com/watch?v=WMetDWhU0z4",
      summary: "American reporters and students discuss whether school uniform policies actually change behavior and academic focus, interviewing parents, students, and school administrators on both sides.",
      analysis: "This is a direct match for Session 1's topic. Students hear natural, conversational American English while collecting real arguments for and against uniforms — useful raw material for classifying Value/Policy/Fact opinions and for the practice debate."
    },
    {
      channel: "Local U.S. TV news report",
      title: "Taking a closer look at the impacts of school uniforms",
      url: "https://www.youtube.com/watch?v=o2UiuKQpPvg",
      summary: "A short American news segment examining the back-to-school uniform debate, presenting the cost-saving and discipline arguments alongside concerns about self-expression.",
      analysis: "Short (under 5 minutes) and conversational, this clip is ideal as a warm-up listening task before Exercise A: students can pause the video and label the reporter's claims as Value, Policy, or Fact in real time."
    }
  ]
});

// ---------------- SESSION 2 ----------------
addSession({
  week: 2,
  title: "Explaining Your Opinion & Giving Reasons",
  skillRef: "Discover Debate – Unit 2: Explaining Your Opinion",
  topicRef: "Exploring Debate 2 – Unit 3: College",
  objectives: [
    "Explain why an opinion must always be supported by a reason.",
    "Use comparison, contrast, and cause-and-effect language to give reasons.",
    "Practice short structured dialogs: opinion → reason → follow-up question.",
    "Build arguments around whether everyone should go to college."
  ],
  lecture: [
    {
      h: "1. An Opinion Needs a Reason",
      body: `<p>An opinion stated alone ("Math is the most important subject") is not yet an argument — it is just a claim. It becomes persuasive only once a <b>reason</b> is attached ("...because we use math every day"). In debate, the job of a speaker is not simply to state a position, but to give reasons that a neutral judge — not just the speaker — would find reasonable.</p>
      <p>A good habit is to always be ready to answer the question "Why?" the moment you state an opinion.</p>`
    },
    {
      h: "2. Language for Giving Reasons",
      body: `<p>Three grammatical patterns cover almost every reason you will ever give in debate:</p>
      <table class="mini-table">
        <tr><th>Pattern</th><th>Structure</th><th>Example</th></tr>
        <tr><td>Comparison / Contrast</td><td>X is [adjective-er] than Y</td><td>"A degree is more valuable than years of unskilled work experience."</td></tr>
        <tr><td>Cause & Effect</td><td>If X, then Y / X leads to Y</td><td>"If tuition keeps rising, fewer low-income students will apply."</td></tr>
        <tr><td>Because-clause</td><td>Opinion + because + reason</td><td>"College is a good investment because graduates earn more over a lifetime."</td></tr>
      </table>
    `},
    {
      h: "3. Practicing the Exchange",
      body: `<p>A classic debate warm-up dialog follows this shape:</p>
      <p><i>A: What do you think of [X]?<br>
      B: I think that [opinion].<br>
      A: Why?<br>
      B: Because [reason].</i></p>
      <p>Practicing this exchange automatically builds the habit of never leaving an opinion unexplained — the single most common weakness in beginner debaters.</p>`
    },
    {
      h: "4. Topic Focus — College",
      body: `<p>Is a college education worth the time and money? Arguments in favor: college prepares people for high-paying, competitive careers; it offers social capital through networking; professors push students toward higher standards. Arguments against: tuition and student debt are enormous financial burdens; several careers do not require a degree; four years is a major opportunity cost that could be spent working or gaining hands-on experience.</p>
      <p><b>Useful vocabulary:</b> tuition, investment, qualification, student loan, financial hardship, commitment, career prospects, networking, opportunity cost.</p>`
    }
  ],
  practice: [
    {
      title: "Exercise A — Opinion + Reason Chains",
      body: `<p>Complete each opinion with a reason using the pattern shown.</p>
      <ol>
        <li>I think that community college is a smart choice ________ (because).</li>
        <li>A four-year university degree is ________ than trade school training (comparison).</li>
        <li>If tuition fees keep increasing, ________ (cause-effect).</li>
      </ol>`
    },
    {
      title: "Exercise B — Pair Dialog",
      body: `<p>With a partner, perform the A/B dialog pattern from the lecture three times, each time using a different opinion about college (e.g., "everyone should go to college," "online degrees are as good as traditional degrees," "college athletes should be paid"). Partner B must always answer "Why?" and Partner A must always give a real reason — no repeating the opinion in different words.</p>`
    }
  ],
  quiz: [
    {q:"What turns a bare opinion into the beginning of an argument?", options:["Repeating it loudly","Attaching a reason","Saying it in a formal tone","Nothing — an opinion is already an argument"], a:1, exp:"An opinion needs a reason to become an argument."},
    {q:"\"College is a good investment because graduates earn more over a lifetime\" uses which pattern?", options:["Comparison","Cause and effect","Because-clause","Signpost"], a:2, exp:"It directly uses 'because' to attach a reason."},

<script>
// ============================================================
// App logic — navigation, tab switching, quiz interactivity
// ============================================================
let currentWeek = 1;
let currentTab = 'lecture';
let quizState = {}; // { weekNumber: { answered: {qIndex: optIndex}, submitted: bool } }

function el(tag, opts={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(opts).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='text') e.textContent=v;
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}

document.getElementById('courseTitle').textContent = COURSE.title;
document.getElementById('courseSub').textContent = COURSE.subtitle;

let drawerScrollY = 0;
function setSessionDrawer(open){
  const nav = document.getElementById('sessionNav');
  const backdrop = document.getElementById('sessionBackdrop');
  const toggle = document.getElementById('sessionToggle');
  const isOpen = !!open;
  if(isOpen){
    drawerScrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = `-${drawerScrollY}px`;
  }
  nav.classList.toggle('open', isOpen);
  backdrop.classList.toggle('open', isOpen);
  document.body.classList.toggle('drawer-open', isOpen);
  toggle.setAttribute('aria-expanded', String(isOpen));
  if(!isOpen){
    document.body.style.top = '';
    window.scrollTo(0, drawerScrollY);
  }
}

// Prevent iOS touch scrolling on the dimmed background while the drawer is open.
document.getElementById('sessionBackdrop').addEventListener('touchmove', e=>e.preventDefault(), {passive:false});

document.getElementById('sessionToggle').addEventListener('click', ()=>{
  const nav = document.getElementById('sessionNav');
  setSessionDrawer(!nav.classList.contains('open'));
});
document.getElementById('sessionBackdrop').addEventListener('click', ()=>setSessionDrawer(false));

function renderNav(){
  const nav = document.getElementById('sessionNav');
  nav.innerHTML = '';
  nav.appendChild(el('div', {class:'nav-title', text:'15 Sessions'}));
  COURSE.sessions.forEach(s=>{
    const btn = el('button', {class:'nav-item' + (s.week===currentWeek ? ' active':'')});
    const n = el('span',{class:'n', text:'S'+s.week});
    btn.appendChild(n);
    btn.appendChild(document.createTextNode(s.title));
    const tag = el('span',{class:'tag', text: s.selfStudy ? 'Self-study (Moodle)' : (s.isReview ? 'Review' : (s.hasMinitest ? 'Includes Minitest' : ''))});
    if(tag.textContent) btn.appendChild(tag);
    btn.addEventListener('click', ()=>{ currentWeek = s.week; currentTab='lecture'; setSessionDrawer(false); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); });
    nav.appendChild(btn);
  });
}

function getSession(week){
  return COURSE.sessions.find(s=>s.week===week);
}

function renderMain(){
  const main = document.getElementById('sessionMain');
  main.innerHTML = '';
  const s = getSession(currentWeek);

  main.appendChild(el('div',{class:'session-kicker', text:'Session ' + s.week + ' of 15'}));
  main.appendChild(el('h2',{class:'session-title', text:s.title}));

  if(s.selfStudy) main.appendChild(el('span',{class:'badge-selfstudy', text:'SELF-STUDY ON MOODLE'}));
  if(s.hasMinitest) main.appendChild(el('span',{class:'badge-minitest', text:'INCLUDES MINITEST'}));
  if(s.isReview) main.appendChild(el('span',{class:'badge-review', text:'REVIEW SESSION'}));

  const refs = el('div',{class:'refs'});
  refs.appendChild(el('span',{class:'ref-chip', html:'<b>Skill:</b> '+s.skillRef}));
  refs.appendChild(el('span',{class:'ref-chip', html:'<b>Topic:</b> '+s.topicRef}));
  main.appendChild(refs);

  const obj = el('div',{class:'objectives'});
  obj.appendChild(el('h3',{text:'Learning Objectives'}));
  const ul = el('ul');
  s.objectives.forEach(o=> ul.appendChild(el('li',{text:o})));
  obj.appendChild(ul);
  main.appendChild(obj);

  // Tabs
  const tabs = [
    {id:'lecture', label:'Lecture'},
    {id:'practice', label:'Practice'},
    {id:'quiz', label:'Quiz ('+s.quiz.length+' Qs)'},
    {id:'videos', label:'Video Resources'}
  ];
  const tabbar = el('div',{class:'tabbar'});
  tabs.forEach(t=>{
    const b = el('button',{class:'tabbtn'+(currentTab===t.id?' active':''), text:t.label});
    b.addEventListener('click', ()=>{ currentTab=t.id; renderMain(); });
    tabbar.appendChild(b);
  });
  main.appendChild(tabbar);

  // Panels
  main.appendChild(renderLecturePanel(s));
  main.appendChild(renderPracticePanel(s));
  main.appendChild(renderQuizPanel(s));
  main.appendChild(renderVideosPanel(s));

  // footer nav
  const footer = el('div',{class:'session-footer-nav'});
  const prev = el('button',{class:'ghost', text:'← Previous session'});
  prev.disabled = s.week<=1;
  prev.addEventListener('click', ()=>{ if(s.week>1){ currentWeek=s.week-1; currentTab='lecture'; renderAll(); window.scrollTo({top:0,behavior:'smooth'});} });
  const next = el('button',{class:'primary', text:'Next session →'});
  next.disabled = s.week>=15;
  next.addEventListener('click', ()=>{ if(s.week<15){ currentWeek=s.week+1; currentTab='lecture'; renderAll(); window.scrollTo({top:0,behavior:'smooth'});} });
  footer.appendChild(prev); footer.appendChild(next);
  main.appendChild(footer);
}

function renderLecturePanel(s){
  const panel = el('div',{class:'tabpanel'+(currentTab==='lecture'?' active':''), id:'panel-lecture'});
  s.lecture.forEach(block=>{
    const b = el('div',{class:'lec-block'});
    b.appendChild(el('h4',{text:block.h}));
    b.appendChild(el('div',{html:block.body}));
    panel.appendChild(b);
  });
  return panel;
}

function renderPracticePanel(s){
  const panel = el('div',{class:'tabpanel'+(currentTab==='practice'?' active':''), id:'panel-practice'});
  s.practice.forEach(p=>{
    const card = el('div',{class:'practice-card'});
    card.appendChild(el('h4',{text:p.title}));
    card.appendChild(el('div',{html:p.body}));
    panel.appendChild(card);
  });
  return panel;
}

function renderQuizPanel(s){
  const panel = el('div',{class:'tabpanel'+(currentTab==='quiz'?' active':''), id:'panel-quiz'});
  if(!quizState[s.week]) quizState[s.week] = {answered:{}, submitted:false};
  const state = quizState[s.week];

  const answeredCount = Object.keys(state.answered).length;
  panel.appendChild(el('div',{class:'quiz-progress', text: `Answered ${answeredCount} of ${s.quiz.length} questions.`}));

  s.quiz.forEach((q, qi)=>{
    const card = el('div',{class:'qcard'});
    card.appendChild(el('div',{class:'qtext', text: (qi+1)+'. '+q.q}));
    q.options.forEach((opt, oi)=>{
      const btn = el('button',{class:'opt'});
      btn.textContent = opt;
      if(state.answered[qi]===oi) btn.classList.add('selected');
      if(state.submitted){
        btn.disabled = true;
        if(oi===q.a) btn.classList.add('correct');
        else if(state.answered[qi]===oi && oi!==q.a) btn.classList.add('incorrect');
      }
      btn.addEventListener('click', ()=>{
        if(state.submitted) return;
        state.answered[qi]=oi;
        renderMain();
      });
      card.appendChild(btn);
    });
    if(state.submitted){
      const exp = el('div',{class:'explain show', html: '<b>'+(state.answered[qi]===q.a ? 'Correct. ':'Not quite. ')+'</b>'+q.exp});
      card.appendChild(exp);
    }
    panel.appendChild(card);
  });

  const actions = el('div',{class:'quiz-actions'});
  if(!state.submitted){
    const submitBtn = el('button',{class:'primary', text:'Check my answers'});
    submitBtn.addEventListener('click', ()=>{ state.submitted = true; renderMain(); });
    actions.appendChild(submitBtn);
  } else {
    let correct = 0;
    s.quiz.forEach((q,qi)=>{ if(state.answered[qi]===q.a) correct++; });
    actions.appendChild(el('div',{class:'score-box', text:`Score: ${correct} / ${s.quiz.length}`}));
    const retryBtn = el('button',{class:'ghost', text:'Retry quiz'});
    retryBtn.addEventListener('click', ()=>{ quizState[s.week] = {answered:{}, submitted:false}; renderMain(); });
    actions.appendChild(retryBtn);
  }
  panel.appendChild(actions);
  return panel;
}

function renderVideosPanel(s){
  const panel = el('div',{class:'tabpanel'+(currentTab==='videos'?' active':''), id:'panel-videos'});
  if(!s.videos || s.videos.length===0){
    panel.appendChild(el('p',{text:'This review session does not require new video resources — please revisit the videos linked in Sessions 1–14.'}));
    return panel;
  }
  s.videos.forEach(v=>{
    const isGap = !v.url;
    const card = el('div',{class:'video-card'+(isGap?' gap':'')});
    card.appendChild(el('div',{class:'vchannel', text:v.channel}));
    card.appendChild(el('h4',{text:v.title}));
    if(v.url){
      card.appendChild(el('a',{class:'vlink', href:v.url, target:'_blank', rel:'noopener', text:v.url}));
    }
    card.appendChild(el('span',{class:'vlabel', text:'Summary'}));
    card.appendChild(el('p',{text:v.summary}));
    card.appendChild(el('span',{class:'vlabel', text:'Why it fits this session'}));
    card.appendChild(el('p',{text:v.analysis}));
    panel.appendChild(card);
  });
  return panel;
}

function renderAll(){
  renderNav();
  renderMain();
}

renderAll();

</script>
